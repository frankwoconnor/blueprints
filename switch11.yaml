blueprint:
  name: Philips Hue Dimmer RWL022 (ZHA - Scene Cycler V11)
  description: "Cycles through 4 scenes. Fixed 'unknown timestamp' error."
  domain: automation
  input:
    remote:
      name: Dimmer Switch
      selector:
        device:
          integration: zha
          model: RWL022
    light_target:
      name: Light(s)
      selector:
        target:
          entity:
            domain: light
    scene_1:
      name: Scene 1
      selector:
        entity:
          domain: scene
    scene_2:
      name: Scene 2
      selector:
        entity:
          domain: scene
    scene_3:
      name: Scene 3
      selector:
        entity:
          domain: scene
    scene_4:
      name: Scene 4
      selector:
        entity:
          domain: scene
    button_top:
      name: "Top Button (Power Toggle)"
      default: []
      selector:
        action: {}

mode: restart

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input remote

action:
  - variables:
      command: "{{ trigger.event.data.command }}"
      args: "{{ trigger.event.data.args }}"
      s1: !input scene_1
      s2: !input scene_2
      s3: !input scene_3
      s4: !input scene_4

  - choose:
      # 1. TOP BUTTON
      - conditions:
          - "{{ command == 'on' or command == 'off_with_effect' }}"
        sequence: !input button_top

      # 2. DIM UP
      - conditions:
          - "{{ command == 'step' and args[0] == 0 }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_step_pct: 10

      # 3. DIM DOWN
      - conditions:
          - "{{ command == 'step' and args[0] == 1 }}"
        sequence:
          - service: light.turn_on
            target: !input light_target
            data:
              brightness_step_pct: -10

      # 4. HUE BUTTON (The Fixed Cycle Logic)
      - conditions:
          - "{{ command == 'recall' or command == 'on_with_recall' }}"
        sequence:
          - service: scene.turn_on
            target:
              entity_id: >
                {% set sc_list = [s1, s2, s3, s4] %}
                {# Map each scene to its timestamp, defaulting to 0 if unknown/none #}
                {% set last_triggered = [
                  as_timestamp(state_attr(s1, 'last_triggered'), 0),
                  as_timestamp(state_attr(s2, 'last_triggered'), 0),
                  as_timestamp(state_attr(s3, 'last_triggered'), 0),
                  as_timestamp(state_attr(s4, 'last_triggered'), 0)
                ] %}
                {% set newest_time = last_triggered | max %}
                {# If no scenes have been triggered, or it's the very first run #}
                {% if newest_time == 0 %}
                  {{ s1 }}
                {% else %}
                  {% set current_index = last_triggered.index(newest_time) %}
                  {% set next_index = (current_index + 1) % 4 %}
                  {{ sc_list[next_index] }}
                {% endif %}
          - delay: 0.5