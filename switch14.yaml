blueprint:
  name: Hue Dimmer V2 - Simplest Scene Cycle Test
  description: |
    Only bottom button cycles all scenes in one Area.
    No helpers. Order = alphabetical.
  domain: automation
  input:
    dimmer_device:
      name: Your Hue Dimmer
      selector:
        device:
          integration: zha
          manufacturer: Signify Netherlands B.V.
          model: RWL022
    scene_area:
      name: Area with Scenes
      selector:
        area: {}
    debounce_ms:
      name: Debounce delay
      default: 400
      selector:
        number:
          min: 0
          max: 1000
          step: 100

trigger:
  - platform: event
    event_type: zha_event
    event_data:
      device_id: !input dimmer_device

action:
  - delay:
      milliseconds: !input debounce_ms
  - variables:
      command: "{{ trigger.event.data.command | default('') }}"

  - choose:
      - conditions:
          - "{{ command in ['recall', 'on_with_recall'] }}"
        sequence:
          - service: script.cycle_any_scene_in_area_simplest
            data:
              area_id: !input scene_area

mode: restart
